plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

/*
 * SMS Helper identity follows the same -PcoreIdentity selection as Core.
 *
 * The helper is always a distinct package/UID.
 * Neutral Core identities receive corresponding neutral helper identities.
 */
def smsHelperIdentityPool = [
    sentinel: [
        applicationId: "com.nefarioussecurity.sentinel.sms",
        label: "Message Service",
    ],
    local01: [
        applicationId: "com.localruntime.message.utility",
        label: "Message Utility",
    ],
    local02: [
        applicationId: "com.localruntime.message.support",
        label: "Message Support",
    ],
    local03: [
        applicationId: "com.localruntime.runtime.message",
        label: "Runtime Message",
    ],
    local04: [
        applicationId: "com.localruntime.background.message",
        label: "Background Message",
    ],
    local05: [
        applicationId: "com.localruntime.device.message",
        label: "Device Message",
    ],
    local06: [
        applicationId: "com.localruntime.local.message",
        label: "Local Message",
    ],
    local07: [
        applicationId: "com.localruntime.runtime.telephony",
        label: "Runtime Service",
    ],
    local08: [
        applicationId: "com.localruntime.background.telephony",
        label: "Background Service",
    ],
]

def coreIdentityKey =
    providers.gradleProperty("coreIdentity")
        .orElse("sentinel")
        .get()

def selectedIdentity =
    smsHelperIdentityPool[coreIdentityKey]

if (selectedIdentity == null) {
    throw new GradleException(
        "Unknown coreIdentity '${coreIdentityKey}'. Valid identities: " +
            smsHelperIdentityPool.keySet().sort().join(", ")
    )
}

logger.lifecycle(
    "SMS Helper identity: ${coreIdentityKey} -> " +
        "${selectedIdentity.applicationId} (${selectedIdentity.label})"
)

android {
    namespace 'com.runtimebridge.smshelper'
    compileSdk 34

    defaultConfig {
        applicationId selectedIdentity.applicationId
        minSdk 26
        targetSdk 34
        versionCode rootProject.ext.sentinelVersionCode
        versionName rootProject.ext.sentinelVersionName

        manifestPlaceholders = [
            smsHelperLabel: selectedIdentity.label
        ]
    }

    signingConfigs {
        release {
            storeFile file(
                keystoreProperties['storeFile']
                    ?: '../../anonymous_key.keystore'
            )
            storePassword keystoreProperties['storePassword'] ?: ''
            keyAlias keystoreProperties['keyAlias'] ?: 'anonymous'
            keyPassword keystoreProperties['keyPassword'] ?: ''
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }

        release {
            minifyEnabled true

            proguardFiles(
                getDefaultProguardFile(
                    'proguard-android-optimize.txt'
                )
            )

            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation project(':helper-api')
    implementation 'androidx.core:core-ktx:1.12.0'
}
